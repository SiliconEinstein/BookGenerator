# Development environment configuration

llm:
  gateway:
    base_url: "${LITELLM_PROXY_API_BASE}"
    api_key: "${LITELLM_PROXY_API_KEY}"
  # 按用途选模型；每项都可用 LLM_<ROLE>_MODEL 环境变量覆盖
  models:
    writer: "cds/GPT-5.4"                       # 正文、摘要、前言、纠错、notebook
    reviewer: "claude-sonnet-4-6"               # 大纲 battle 的对手模型
    utility: "gemini-3.1-pro-preview"           # 结构化输出、关键词扩展、插图选点
    image: "sn/gemini-3-pro-image-preview"      # 插图生成
  # 大纲 battle 的评委，取多数票；应挑选相互独立的模型
  evaluators:
    - "cds/GPT-5.4"
    - "claude-sonnet-4-6"
    - "gemini-3.1-pro-preview"
  # writer 调用失败时依次降级
  writer_fallbacks:
    - "azure/gpt-5"
    - "aliyun/deepseek-v4-pro"

wiki:
  search_api_base: "${WIKI_SEARCH_API_BASE}"

output:
  base_dir: "output/books"
  temp_dir: "output/temp"

prompts:
  base_dir_ch: "prompts"      # 中文场景下默认prompt保存路径
  base_dir_en: "prompts_en"    # 英文场景下prompt保存路径
  names:
    abstract: "prompt_abstract"
    chapter: "prompt_chapter"
    battle: "prompt_chapter_refine"
    eval_chapter: "prompt_chapter_eval"
    book: "prompt_book"
    book_step2: "prompt_book_step2"
    book_step3: "prompt_book_step3"
    select_project_qa: "prompt_select_project_qa"

concurrency:
  abstract_semaphore: 20
  subchapter_semaphore: 20
  chapter_semaphore: 12
